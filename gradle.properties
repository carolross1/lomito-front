android.useAndroidX=true
kotlin.code.style=official
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.daemon=true
org.gradle.parallel=true

# ✅ IP/URL del backend, en UN SOLO lugar para mobile y wear.
# Cambia solo esta línea (ej. al pasar a producción o cambiar de red)
# y todos los módulos la toman automáticamente vía BuildConfig.BACKEND_URL
LOMITO_BACKEND_URL=http://192.168.100.12:3000